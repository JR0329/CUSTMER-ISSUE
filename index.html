<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>客訴快速填單</title>

<!-- PWA 安裝設定 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2F5496">

<!-- iOS「加到主畫面」專屬設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="客訴填單">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- EmailJS：送出表單時自動寄信通知負責人用 -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
    background: #f2f4f7;
    margin: 0;
    padding: 0 0 100px 0;
    color: #222;
  }
  header {
    background: #2F5496;
    color: white;
    padding: 18px 16px;
    font-size: 20px;
    font-weight: bold;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .sub {
    font-size: 13px;
    font-weight: normal;
    opacity: 0.85;
    margin-top: 2px;
  }
  form {
    max-width: 640px;
    margin: 0 auto;
    padding: 16px;
  }
  .field {
    background: white;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .field label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    color: #333;
    margin-bottom: 6px;
  }
  .field label .required {
    color: #d33;
    font-weight: normal;
    font-size: 12px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    font-size: 16px; /* 16px以上避免iOS自動放大畫面 */
    font-family: inherit;
    background: white;
  }
  .field textarea {
    resize: vertical;
    min-height: 70px;
  }
  .note {
    font-size: 13px;
    color: #888;
    padding: 4px 6px 16px 6px;
    line-height: 1.5;
  }
  .fallback {
    display: none;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .fallback.show { display: block; }
  .fallback p {
    font-size: 13px;
    color: #6b5900;
    margin: 0 0 8px 0;
    line-height: 1.5;
  }
  .fallback textarea {
    width: 100%;
    height: 90px;
    font-family: monospace;
    font-size: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px;
  }
  .fallback button {
    margin-top: 8px;
    width: 100%;
    background: #f9a825;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    font-weight: bold;
  }
  .submit-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: white;
    padding: 12px 16px;
    box-shadow: 0 -2px 6px rgba(0,0,0,0.08);
  }
  .submit-bar button {
    width: 100%;
    max-width: 640px;
    display: block;
    margin: 0 auto;
    background: #2F5496;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 16px;
    font-size: 17px;
    font-weight: bold;
  }
  .submit-bar button:active { background: #24406f; }
  .toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: #2e7d32;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    max-width: 90%;
    text-align: center;
    display: none;
    z-index: 20;
    cursor: pointer;
  }
  .toast.error { background: #c62828; }

  /* 送出結果視窗：不會自動消失，一定要按按鈕才會關閉 */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: white;
    border-radius: 14px;
    padding: 24px 20px 18px 20px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  }
  .modal-icon { font-size: 44px; line-height: 1; margin-bottom: 8px; }
  .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
  .modal.ok .modal-title { color: #2e7d32; }
  .modal.fail .modal-title { color: #c62828; }
  .modal.warn .modal-title { color: #e65100; }
  .modal.wait .modal-title { color: #2F5496; }
  .modal-msg {
    font-size: 14px;
    color: #444;
    line-height: 1.6;
    text-align: left;
    margin-bottom: 16px;
    word-break: break-word;
  }
  .modal-detail {
    margin-top: 8px;
    padding: 8px;
    background: #f5f5f5;
    border-radius: 6px;
    font-size: 12px;
    color: #666;
    font-family: monospace;
  }
  .modal-actions { display: flex; flex-direction: column; gap: 10px; }
  .modal-actions button {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    background: #e8eaf0;
    color: #2F5496;
  }
  .modal-actions button.primary { background: #2F5496; color: white; }
  .modal-actions button.danger { background: #c62828; color: white; }
  .modal-actions button:active { opacity: 0.8; }
</style>
</head>
<body>

<header>
  客訴快速填單
  <div class="sub">填完按下方送出，系統會自動通知管理員整理　<span id="appVersion"></span></div>
</header>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="resultModal">
  <div class="modal" id="modalBox">
    <div class="modal-icon" id="modalIcon"></div>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-msg" id="modalMsg"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<form id="complaintForm">
  <div class="field">
    <label>異常現象描述 <span class="required">（必填）</span></label>
    <textarea id="f_phenomenon" rows="4" placeholder="請描述看到的異常現象..."></textarea>
  </div>

  <div class="field">
    <label>通報單位/客戶名稱</label>
    <select id="f_customer_select" onchange="toggleCustomerOther()">
      <option value="">請選擇...</option>
      <option value="台南 TTIP">台南 TTIP</option>
      <option value="觀音 Linde">觀音 Linde</option>
      <option value="台南 Linde">台南 Linde</option>
      <option value="旺宏 MXIC">旺宏 MXIC</option>
      <option value="台積電 F15a">台積電 F15a</option>
      <option value="台積電 F15b">台積電 F15b</option>
      <option value="其他">其他（請自行輸入）</option>
    </select>
    <input type="text" id="f_customer_other" placeholder="請輸入客戶名稱"
           style="display:none; margin-top:8px;">
  </div>

  <div class="field">
    <label>抱怨接獲者</label>
    <input type="text" id="f_receiver">
  </div>

  <div class="field">
    <label>抱怨日期</label>
    <input type="date" id="f_date">
  </div>

  <div class="field">
    <label>相關設備/型號</label>
    <input type="text" id="f_device">
  </div>

  <div class="field">
    <label>懷疑根因與驗證過程（現場初步判斷，選填）</label>
    <textarea id="f_cause" rows="3"></textarea>
  </div>

  <div class="field">
    <label>矯正行動擬定（選填）</label>
    <textarea id="f_action" rows="3"></textarea>
  </div>

  <div class="note">
    ※ 矯正有效性、根因確認狀態等欄位不需要現在填寫，之後結案分析時由負責人回頭補齊。<br>
    ※ 按送出後會自動寄信通知管理員，並跳出結果視窗。寄信成功可選擇是否下載備份檔；如果沒有網路導致寄信失敗，表單內容會保留，可在視窗中下載檔案、一鍵複製，或網路恢復後重新送出。
  </div>
</form>

<div class="fallback" id="fallbackBox">
  <p>⚠ 如果剛剛按送出沒有自動下載檔案（部分手機瀏覽環境會擋下自動下載），
  請從下方文字框「全選」→「複製」，貼到記事本或訊息中傳給資料庫負責人：</p>
  <textarea id="fallbackText" readonly></textarea>
  <button onclick="copyFallback()">一鍵複製</button>
</div>

<div class="submit-bar">
  <button id="submitBtn" onclick="submitForm()">送出</button>
</div>

<script>
// EmailJS 設定值（Public Key可公開放在前端，不是密碼；Service/Template ID也不是密碼）
const EMAILJS_PUBLIC_KEY = "ccnWdZoeh8v_Btc7R";
const EMAILJS_SERVICE_ID = "service_lapp2xn";
const EMAILJS_TEMPLATE_ID = "template_aj6mhqp";
if (window.emailjs) {
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
}

// 版本號：顯示在頁首，方便確認手機上跑的是不是最新版
const APP_VERSION = 'v4 (2026-10-06)';
document.getElementById('appVersion').textContent = APP_VERSION;

// 設定日期欄位預設為今天
document.getElementById('f_date').valueAsDate = new Date();

function toggleCustomerOther() {
  const select = document.getElementById('f_customer_select');
  const otherInput = document.getElementById('f_customer_other');
  if (select.value === '其他') {
    otherInput.style.display = 'block';
    otherInput.focus();
  } else {
    otherInput.style.display = 'none';
    otherInput.value = '';
  }
}

function getCustomerValue() {
  const select = document.getElementById('f_customer_select');
  if (select.value === '其他') {
    return document.getElementById('f_customer_other').value.trim();
  }
  return select.value;
}

let toastHideTimer = null;
let toastVisibilityHandler = null;

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';

  // 手機上按送出後，瀏覽器通常會立刻彈出「下載/分享檔案」的原生畫面蓋住整個網頁，
  // 這段期間網頁雖然還在跑，但使用者完全看不到提示。如果這時候倒數計時器還是照跑，
  // 等使用者關閉那個畫面回來時，提示常常早就消失了，導致線上/離線看起來「都一樣」。
  // 解法：如果提示顯示的當下網頁是被蓋住看不到的狀態(document.hidden)，就先不要倒數，
  // 等使用者真正回到網頁畫面(visibilitychange變成visible)才開始倒數，確保一定看得到。
  if (toastHideTimer) {
    clearTimeout(toastHideTimer);
    toastHideTimer = null;
  }
  if (toastVisibilityHandler) {
    document.removeEventListener('visibilitychange', toastVisibilityHandler);
    toastVisibilityHandler = null;
  }

  const scheduleHide = () => {
    toastHideTimer = setTimeout(() => { t.style.display = 'none'; }, 5000);
  };

  if (document.hidden) {
    toastVisibilityHandler = () => {
      if (!document.hidden) {
        document.removeEventListener('visibilitychange', toastVisibilityHandler);
        toastVisibilityHandler = null;
        scheduleHide();
      }
    };
    document.addEventListener('visibilitychange', toastVisibilityHandler);
  } else {
    scheduleHide();
  }

  // 保險：萬一使用者沒注意到提示自動消失，提供點一下提示本身也能手動關閉
  t.onclick = () => { t.style.display = 'none'; };
}

function csvEscape(value) {
  const v = (value || '').toString();
  return '"' + v.replace(/"/g, '""') + '"';
}

async function copyFallback() {
  const text = document.getElementById('fallbackText').value;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.getElementById('fallbackText');
      document.getElementById('fallbackBox').classList.add('show');
      ta.select();
      ta.setSelectionRange(0, 999999); // 手機瀏覽器相容寫法
      if (!document.execCommand('copy')) throw new Error('copy failed');
    }
    showToast('已複製，請貼到記事本或訊息中傳出', false);
  } catch (e) {
    document.getElementById('fallbackBox').classList.add('show');
    showToast('複製失敗，請在下方文字框長按選取全部內容後手動複製', true);
  }
}

// 註冊 Service Worker，讓這個網頁能被安裝並離線使用
// 同時主動偵測新版本：已經加到主畫面的使用者，下次打開App時
// 如果偵測到有新版本上線，會自動重新整理一次抓取最新內容，
// 不用使用者自己想辦法清快取或重新安裝。
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      const isUpdate = !!navigator.serviceWorker.controller;
      reg.update().catch(function(){});
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'activated' && isUpdate) {
              window.location.reload();
            }
          });
        }
      });
    }).catch((err) => {
      console.log("Service Worker 註冊失敗:", err);
    });
  });
}

// 任何未預期的程式錯誤都顯示在畫面上，避免「按了沒反應」卻不知道原因
window.addEventListener('error', (ev) => {
  showToast('程式錯誤：' + (ev.message || '未知錯誤'), true);
});
window.addEventListener('unhandledrejection', (ev) => {
  const r = ev.reason;
  showToast('程式錯誤：' + ((r && (r.message || r.text)) || String(r)), true);
});

// ===== 結果視窗 =====
let lastCsv = null;     // { content, filename }：最近一次送出的CSV內容，供「下載」按鈕使用
let isSending = false;  // 避免連按送出造成重複寄信

function openModal(kind, icon, title, bodyHtml, actions) {
  document.getElementById('modalBox').className = 'modal ' + kind;
  document.getElementById('modalIcon').textContent = icon;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMsg').innerHTML = bodyHtml;
  const box = document.getElementById('modalActions');
  box.innerHTML = '';
  actions.forEach((a) => {
    const b = document.createElement('button');
    b.textContent = a.label;
    if (a.cls) b.className = a.cls;
    b.onclick = a.onClick;
    box.appendChild(b);
  });
  document.getElementById('resultModal').classList.add('show');
}

// 寄信逾時保護：避免網路卡住時畫面完全沒有任何回應
function withTimeout(promise, ms) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      const err = new Error('等待回應超過 ' + (ms / 1000) + ' 秒');
      err.isTimeout = true;
      reject(err);
    }, ms);
    promise.then(
      (v) => { clearTimeout(timer); resolve(v); },
      (e) => { clearTimeout(timer); reject(e); }
    );
  });
}

function closeModal() {
  document.getElementById('resultModal').classList.remove('show');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// 使用者主動按下「下載」才會觸發，所以系統的存檔畫面不會蓋掉結果視窗
function downloadCsv() {
  if (!lastCsv) return;
  try {
    const blob = new Blob([lastCsv.content], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = lastCsv.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) {
    document.getElementById('fallbackBox').classList.add('show');
    showToast('自動下載失敗，請改用「一鍵複製」', true);
  }
}

function clearForm() {
  document.getElementById('f_phenomenon').value = '';
  document.getElementById('f_customer_select').value = '';
  document.getElementById('f_customer_other').value = '';
  document.getElementById('f_customer_other').style.display = 'none';
  document.getElementById('f_receiver').value = '';
  document.getElementById('f_device').value = '';
  document.getElementById('f_cause').value = '';
  document.getElementById('f_action').value = '';
  document.getElementById('fallbackBox').classList.remove('show');
  lastCsv = null;
}

async function submitForm() {
  if (isSending) return;

  const phenomenon = document.getElementById('f_phenomenon').value.trim();
  if (!phenomenon) {
    showToast('「異常現象描述」為必填欄位，請填寫後再送出', true);
    document.getElementById('f_phenomenon').focus();
    return;
  }

  const now = new Date();
  const pad = n => n.toString().padStart(2, '0');
  const timestamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

  const customerValue = getCustomerValue();
  const receiverValue = document.getElementById('f_receiver').value;
  const dateValue = document.getElementById('f_date').value;
  const deviceValue = document.getElementById('f_device').value;
  const causeValue = document.getElementById('f_cause').value;
  const actionValue = document.getElementById('f_action').value;

  const fields = {
    "通報單位/客戶名稱": customerValue,
    "抱怨接獲者": receiverValue,
    "抱怨日期": dateValue,
    "相關設備/型號": deviceValue,
    "異常現象描述": phenomenon,
    "懷疑根因與驗證過程": causeValue,
    "矯正行動擬定": actionValue,
    "案件來源檔案": "現場填單_" + timestamp,
  };

  const headers = Object.keys(fields);
  const headerLine = headers.map(csvEscape).join(',');
  const dataLine = headers.map(h => csvEscape(fields[h])).join(',');
  // 加上UTF-8 BOM，確保Excel直接雙擊打開時中文不會變亂碼
  const csvContent = '\ufeff' + headerLine + '\r\n' + dataLine + '\r\n';
  lastCsv = { content: csvContent, filename: `客訴填單_${timestamp}.csv` };
  document.getElementById('fallbackText').value = headerLine + '\n' + dataLine;

  // 寄信通知管理員 (收件人固定在EmailJS template裡設定好)
  isSending = true;
  let emailTimedOut = false;
  let emailWorked = false;
  let emailErrorDetail = '';
  const submitBtn = document.getElementById('submitBtn');
  const originalBtnText = submitBtn.textContent;
  try {
    if (!window.emailjs) {
      throw new Error('EmailJS SDK未載入（可能沒有網路）');
    }
    submitBtn.textContent = '寄送中...';
    submitBtn.disabled = true;
    openModal('wait', '⏳', '寄送中...', '請稍候，正在通知管理員，請不要關閉畫面。', []);
    const result = await withTimeout(emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      customer: customerValue,
      receiver: receiverValue,
      date: dateValue,
      device: deviceValue,
      phenomenon: phenomenon,
      cause: causeValue,
      action: actionValue,
    }), 20000);
    console.log('EmailJS 寄信成功:', result);
    emailWorked = true;
  } catch (e) {
    emailWorked = false;
    emailTimedOut = !!(e && e.isTimeout);
    // 把實際錯誤內容顯示在失敗視窗裡，方便回報問題
    const statusPart = (e && typeof e.status !== 'undefined') ? `status=${e.status}` : '';
    const textPart = (e && e.text) ? e.text : '';
    const msgPart = (e && e.message) ? e.message : '';
    emailErrorDetail = [statusPart, textPart, msgPart].filter(Boolean).join(' / ') || String(e);
    console.log('EmailJS 寄信失敗:', e);
  } finally {
    submitBtn.textContent = originalBtnText;
    submitBtn.disabled = false;
    isSending = false;
  }

  if (emailWorked) {
    openModal('ok', '✅', '已自動發送給管理員',
      '填單內容已寄出。需要的話可以另外下載一份備份檔。',
      [
        { label: '下載備份檔案', onClick: downloadCsv },
        { label: '確定', cls: 'primary', onClick: () => { closeModal(); clearForm(); } },
      ]);
  } else if (emailTimedOut) {
    document.getElementById('fallbackBox').classList.add('show');
    openModal('warn', '❓', '無法確認是否寄出',
      '等了 20 秒沒有收到回應，信<b>可能已寄出，也可能沒有</b>。請先向管理員確認是否收到，避免重複送出。你填的內容還保留在表單中。' +
      '<div class="modal-detail">' + escapeHtml(emailErrorDetail) + '</div>',
      [
        { label: '下載檔案', cls: 'primary', onClick: downloadCsv },
        { label: '一鍵複製', onClick: copyFallback },
        { label: '重新送出', onClick: () => { closeModal(); submitForm(); } },
        { label: '關閉（保留表單）', onClick: closeModal },
      ]);
  } else {
    document.getElementById('fallbackBox').classList.add('show');
    openModal('fail', '⚠️', '寄信失敗',
      '管理員<b>可能尚未</b>收到通知，你填的內容還保留在表單中。可以先下載檔案或一鍵複製留存，等網路恢復後按「重新送出」。' +
      '<div class="modal-detail">' + escapeHtml(emailErrorDetail) + '</div>',
      [
        { label: '重新送出', cls: 'primary', onClick: () => { closeModal(); submitForm(); } },
        { label: '下載檔案', onClick: downloadCsv },
        { label: '一鍵複製', onClick: copyFallback },
        { label: '關閉（保留表單）', onClick: closeModal },
      ]);
  }
}
</script>

</body>
</html>
