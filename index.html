<script>

function toggleCustomerOther() {
  const select = document.getElementById('f_customer_select');
  const otherInput = document.getElementById('f_customer_other');

    otherInput.style.display = 'block';

function getCustomerValue() {

  if (select.value === '其他') {
    return document.getElementById('f_customer_other').value.trim();
  }
  return select.value;

let toastHideTimer = null;
let toastVisibilityHandler = null;

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';

  // 手機上按送出後，瀏覽器通常會立刻彈出「下載/分享檔案」的原生畫面蓋住整個網頁，
  // 這段期間網頁雖然還在跑，但使用者完全看不到提示。如果這時候倒數計時器還是照跑，
  // 等使用者關閉那個畫面回來時，提示常常早就消失了，導致線上/離線看起來「都一樣」。
  // 解法：如果提示顯示的當下網頁是被蓋住看不到的狀態(document.hidden)，就先不要倒數，
  // 等使用者真正回到網頁畫面(visibilitychange變成visible)才開始倒數，確保一定看得到。
  if (toastHideTimer) {
    clearTimeout(toastHideTimer);
    toastHideTimer = null;
  }
  if (toastVisibilityHandler) {
    document.removeEventListener('visibilitychange', toastVisibilityHandler);
    toastVisibilityHandler = null;
  }

  const scheduleHide = () => {
    toastHideTimer = setTimeout(() => { t.style.display = 'none'; }, 5000);
  };

  if (document.hidden) {
    toastVisibilityHandler = () => {
      if (!document.hidden) {
        document.removeEventListener('visibilitychange', toastVisibilityHandler);
        toastVisibilityHandler = null;
        scheduleHide();
      }
    };
    document.addEventListener('visibilitychange', toastVisibilityHandler);
  } else {
    scheduleHide();
  }

  // 保險：萬一使用者沒注意到提示自動消失，提供點一下提示本身也能手動關閉
  t.onclick = () => { t.style.display = 'none'; };
}

function csvEscape(value) {
  const v = (value || '').toString();
  return '"' + v.replace(/"/g, '""') + '"';
}

async function copyFallback() {
  const text = document.getElementById('fallbackText').value;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.getElementById('fallbackText');
      document.getElementById('fallbackBox').classList.add('show');
      ta.select();
      ta.setSelectionRange(0, 999999); // 手機瀏覽器相容寫法
      if (!document.execCommand('copy')) throw new Error('copy failed');
    }
    showToast('已複製，請貼到記事本或訊息中傳出', false);
  } catch (e) {
    document.getElementById('fallbackBox').classList.add('show');
    showToast('複製失敗，請在下方文字框長按選取全部內容後手動複製', true);
  }
}

// 註冊 Service Worker，讓這個網頁能被安裝並離線使用
// 同時主動偵測新版本：已經加到主畫面的使用者，下次打開App時
// 如果偵測到有新版本上線，會自動重新整理一次抓取最新內容，
// 不用使用者自己想辦法清快取或重新安裝。
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      const isUpdate = !!navigator.serviceWorker.controller;
      reg.update().catch(function(){});
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        if (newWorker) {
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'activated' && isUpdate) {
              window.location.reload();
            }
          });
        }
      });
    }).catch((err) => {
      console.log("Service Worker 註冊失敗:", err);
    });
  });
}

// 任何未預期的程式錯誤都顯示在畫面上，避免「按了沒反應」卻不知道原因
window.addEventListener('error', (ev) => {
  showToast('程式錯誤：' + (ev.message || '未知錯誤'), true);
});
window.addEventListener('unhandledrejection', (ev) => {
  const r = ev.reason;
  showToast('程式錯誤：' + ((r && (r.message || r.text)) || String(r)), true);
});

let lastCsv = null;     // { content, filename }：最近一次送出的CSV內容，供「下載」按鈕使用
let isSending = false;  // 避免連按送出造成重複寄信

function openModal(kind, icon, title, bodyHtml, actions) {
  document.getElementById('modalBox').className = 'modal ' + kind;
  document.getElementById('modalIcon').textContent = icon;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalMsg').innerHTML = bodyHtml;
  const box = document.getElementById('modalActions');
  box.innerHTML = '';
  actions.forEach((a) => {
    const b = document.createElement('button');
    b.textContent = a.label;
    if (a.cls) b.className = a.cls;
    b.onclick = a.onClick;
    box.appendChild(b);
  });
  document.getElementById('resultModal').classList.add('show');
}

// 寄信逾時保護：避免網路卡住時畫面完全沒有任何回應
function withTimeout(promise, ms) {
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      const err = new Error('等待回應超過 ' + (ms / 1000) + ' 秒');
      err.isTimeout = true;
      reject(err);
    }, ms);
    promise.then(
      (v) => { clearTimeout(timer); resolve(v); },
      (e) => { clearTimeout(timer); reject(e); }
    );
  });
}

function closeModal() {
  document.getElementById('resultModal').classList.remove('show');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// 使用者主動按下「下載」才會觸發，所以系統的存檔畫面不會蓋掉結果視窗
function downloadCsv() {
  if (!lastCsv) return;
  try {
    const blob = new Blob([lastCsv.content], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = lastCsv.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) {
    document.getElementById('fallbackBox').classList.add('show');
    showToast('自動下載失敗，請改用「一鍵複製」', true);
  }
}

let skipPhotos = false;

function compressImage(file, maxSide, quality) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        c.toBlob((b) => {
          URL.revokeObjectURL(url);
          b ? resolve(b) : reject(new Error('照片壓縮失敗'));
        }, 'image/jpeg', quality);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取這張照片')); };
    img.src = url;
  });
}

  grid.innerHTML = '';
  photos.forEach((p, i) => {
    const d = document.createElement('div');
    d.className = 'photo-item';
    const im = document.createElement('img');
    im.src = p.thumbUrl;
    const rm = document.createElement('button');
    rm.type = 'button'; rm.className = 'rm'; rm.textContent = '✕';
    rm.onclick = () => {
      URL.revokeObjectURL(p.thumbUrl);
      photos.splice(i, 1);
      renderPhotos();
    };
    d.appendChild(im); d.appendChild(rm);
    grid.appendChild(d);
  });
  const full = photos.length >= MAX_PHOTOS;
  document.getElementById('btnCamera').disabled = full;
  document.getElementById('btnAlbum').disabled = full;
}

async function addPhotoFiles(fileList) {
  const files = Array.from(fileList || []);
  let skipped = 0;
  for (const f of files) {
    if (photos.length >= MAX_PHOTOS) { skipped++; continue; }
    try {
      const blob = await compressImage(f, 1280, 0.75);
      photos.push({ blob, thumbUrl: URL.createObjectURL(blob), uploadedUrl: null });
    } catch (e) {
      showToast('照片處理失敗：' + (e.message || e), true);
    }
  }
  renderPhotos();
  if (skipped) showToast('最多只能附 ' + MAX_PHOTOS + ' 張，多的已略過', true);
}
['f_photo_camera', 'f_photo_album'].forEach((id) => {
  document.getElementById(id).addEventListener('change', (ev) => {
    addPhotoFiles(ev.target.files);
    ev.target.value = '';   // 允許連續選同一張或再拍一張
  });
});

async function uploadPhoto(p) {
  if (p.uploadedUrl) return p.uploadedUrl;
  const fd = new FormData();
  fd.append('file', p.blob, 'photo.jpg');
  fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const res = await withTimeout(fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/image/upload', { method: 'POST', body: fd }), 40000);
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok || !data || !data.secure_url) {
    const err = new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  p.uploadedUrl = data.secure_url;
  return p.uploadedUrl;
}

async function uploadCsv(csv, timestamp) {
  const fd = new FormData();
  fd.append('file', new Blob([csv.content], { type: 'text/csv' }), 'complaint.csv');
  fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  fd.append('public_id', 'complaint_' + timestamp + '.csv');
  const res = await withTimeout(fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/raw/upload', { method: 'POST', body: fd }), 30000);
  const data = await res.json();
  if (!res.ok || !data.secure_url) throw new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
  return data.secure_url;
}

function clearForm() {
  photos.forEach((p) => URL.revokeObjectURL(p.thumbUrl));
  photos = [];
  renderPhotos();
  skipPhotos = false;
  document.getElementById('f_phenomenon').value = '';
  document.getElementById('f_customer_select').value = '';
  document.getElementById('f_customer_other').value = '';
  document.getElementById('f_customer_other').style.display = 'none';
  document.getElementById('f_receiver').value = '';
  document.getElementById('f_device').value = '';
  document.getElementById('f_cause').value = '';
  document.getElementById('f_action').value = '';
  document.getElementById('fallbackBox').classList.remove('show');
  lastCsv = null;
}

async function submitForm() {
  if (isSending) return;
  const skipThis = skipPhotos;
  skipPhotos = false;

  const phenomenon = document.getElementById('f_phenomenon').value.trim();
  if (!phenomenon) {
    showToast('「異常現象描述」為必填欄位，請填寫後再送出', true);
    document.getElementById('f_phenomenon').focus();
    return;
  }

  const now = new Date();
  const pad = n => n.toString().padStart(2, '0');
  const timestamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

  const customerValue = getCustomerValue();
  const receiverValue = document.getElementById('f_receiver').value;
  const dateValue = document.getElementById('f_date').value;
  const deviceValue = document.getElementById('f_device').value;
  const causeValue = document.getElementById('f_cause').value;
  const actionValue = document.getElementById('f_action').value;

  const fields = {
    "通報單位/客戶名稱": customerValue,
    "抱怨接獲者": receiverValue,
    "抱怨日期": dateValue,
    "相關設備/型號": deviceValue,
    "異常現象描述": phenomenon,
    "懷疑根因與驗證過程": causeValue,
    "矯正行動擬定": actionValue,
    "案件來源檔案": "現場填單_" + timestamp,
  };

  const headers = Object.keys(fields);
  const headerLine = headers.map(csvEscape).join(',');
  const dataLine = headers.map(h => csvEscape(fields[h])).join(',');
  // 加上UTF-8 BOM，確保Excel直接雙擊打開時中文不會變亂碼
  const csvContent = '\ufeff' + headerLine + '\r\n' + dataLine + '\r\n';
  lastCsv = { content: csvContent, filename: `客訴填單_${timestamp}.csv` };
  document.getElementById('fallbackText').value = headerLine + '\n' + dataLine;

  // 寄信通知管理員 (收件人固定在EmailJS template裡設定好)
  isSending = true;
  let emailTimedOut = false;
  let emailWorked = false;
  let emailErrorDetail = '';
  let photoFailed = false;
  let photoLinks = [];
  let pendingParams = null;
  const submitBtn = document.getElementById('submitBtn');
  const originalBtnText = submitBtn.textContent;
  try {
    if (!window.emailjs) {
      throw new Error('EmailJS SDK未載入（可能沒有網路）');
    }
    submitBtn.textContent = '寄送中...';
    submitBtn.disabled = true;
    openModal('wait', '⏳', '寄送中...', '請稍候，正在通知管理員，請不要關閉畫面。', []);
    if (photosEnabled && !skipThis && photos.length) {
      for (let i = 0; i < photos.length; i++) {
        openModal('wait', '⏳', '上傳照片中...', '第 ' + (i + 1) + ' / ' + photos.length + ' 張，請稍候，請不要關閉畫面。', []);
        try {
          photoLinks.push(await uploadPhoto(photos[i]));
        } catch (pe) {
          photoFailed = true;
          throw pe;
        }
      }
      openModal('wait', '⏳', '寄送中...', '請稍候，正在通知管理員，請不要關閉畫面。', []);
    }
    if (photoLinks.length) {
      const h2 = headerLine + ',' + csvEscape('照片連結');
      const d2 = dataLine + ',' + csvEscape(photoLinks.join('\n'));
      lastCsv = { content: '\ufeff' + h2 + '\r\n' + d2 + '\r\n', filename: lastCsv.filename };
      document.getElementById('fallbackText').value = h2 + '\n' + d2;
    }
    // 把 CSV(Excel 可開)傳到雲端，信裡附下載連結；失敗不影響寄信
    let csvLink = '';
    let csvFailed = false;
    if (photosEnabled) {
      try {
        openModal('wait', '⏳', '準備 Excel 檔...', '請稍候，請不要關閉畫面。', []);
        csvLink = await uploadCsv(lastCsv, timestamp);
      } catch (ce) {
        csvFailed = true;
        console.log('CSV 上傳失敗:', ce);
      }
      openModal('wait', '⏳', '寄送中...', '請稍候，正在通知管理員，請不要關閉畫面。', []);
    }
    const photoText = (photoLinks.length ? '\n\n【現場照片】\n' + photoLinks.join('\n') : '')
      + (csvLink ? '\n\n【Excel/CSV 檔下載】\n' + csvLink : '')
      + (csvFailed ? '\n\n（CSV 檔連結產生失敗，請向填單人索取）' : '');
    pendingParams = { customer: customerValue, receiver: receiverValue, date: dateValue, device: deviceValue, phenomenon: phenomenon + photoText, cause: causeValue, action: actionValue };
    const result = await withTimeout(emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      customer: customerValue,
      receiver: receiverValue,
      date: dateValue,
      device: deviceValue,
      phenomenon: phenomenon + photoText,
      cause: causeValue,
      action: actionValue,
    }), 20000);
    console.log('EmailJS 寄信成功:', result);
    emailWorked = true;
  } catch (e) {
    emailWorked = false;
    emailTimedOut = !!(e && e.isTimeout) && !photoFailed;
    // 把實際錯誤內容顯示在失敗視窗裡，方便回報問題
    const statusPart = (e && typeof e.status !== 'undefined') ? `status=${e.status}` : '';
    const textPart = (e && e.text) ? e.text : '';
    const msgPart = (e && e.message) ? e.message : '';
    emailErrorDetail = [statusPart, textPart, msgPart].filter(Boolean).join(' / ') || String(e);
    console.log('EmailJS 寄信失敗:', e);
  } finally {
    submitBtn.textContent = originalBtnText;
    submitBtn.disabled = false;
    isSending = false;
  }

  if (emailWorked) {
    if (pendingParams) removeQueued(pendingParams);
    openModal('ok', '✅', '已自動發送給管理員',
      '填單內容已寄出。需要的話可以另外下載一份備份檔。',
      [
        { label: '下載備份檔案', onClick: downloadCsv },
        { label: '確定', cls: 'primary', onClick: () => { closeModal(); clearForm(); } },
      ]);
  } else if (emailTimedOut) {
    document.getElementById('fallbackBox').classList.add('show');
    openModal('warn', '❓', '無法確認是否寄出',
      '等了 20 秒沒有收到回應，信<b>可能已寄出，也可能沒有</b>。請先向管理員確認是否收到，避免重複送出。你填的內容還保留在表單中。' +
      '<div class="modal-detail">' + escapeHtml(emailErrorDetail) + '</div>',
      [
        { label: '下載檔案', cls: 'primary', onClick: downloadCsv },
        { label: '一鍵複製', onClick: copyFallback },
        { label: '重新送出', onClick: () => { closeModal(); submitForm(); } },
        { label: '關閉（保留表單）', onClick: closeModal },
      ]);
  } else {
    if (!photoFailed && pendingParams && enqueueSubmission(pendingParams)) {
      emailErrorDetail += ' ／ 已暫存在這支手機，連上網路後會自動重送，不必重填（也請不要再重複填寫）';
    }
    document.getElementById('fallbackBox').classList.add('show');
    openModal('fail', '⚠️', photoFailed ? '照片上傳失敗' : '寄信失敗',
      (photoFailed ? '照片沒有上傳成功，<b>信還沒寄出</b>，你填的內容還保留在表單中。可以重新送出，或先不帶照片直接寄出。' : '管理員<b>可能尚未</b>收到通知，你填的內容還保留在表單中。可以先下載檔案或一鍵複製留存，等網路恢復後按「重新送出」。') +
      '<div class="modal-detail">' + escapeHtml(emailErrorDetail) + '</div>',
      [
        { label: '重新送出', cls: 'primary', onClick: () => { closeModal(); submitForm(); } },
        ...(photoFailed ? [{ label: '不帶照片直接寄出', onClick: () => { skipPhotos = true; closeModal(); submitForm(); } }] : []),
        { label: '下載檔案', onClick: downloadCsv },
        { label: '一鍵複製', onClick: copyFallback },
        { label: '關閉（保留表單）', onClick: closeModal },
      ]);
  }
}

// ===== v7：離線暫存 + 自動重送 =====
const QUEUE_KEY = 'complaintQueueV1';
function loadQueue() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch (e) { return []; } }
function saveQueue(q) { try { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); return true; } catch (e) { return false; } }
function queueKey(p) { return [p.date, p.customer, p.device, String(p.phenomenon).split(/\n\n[【（]/)[0]].join('|'); }
function enqueueSubmission(p) {
  const q = loadQueue();
  if (!q.some(x => x.key === queueKey(p))) q.push({ key: queueKey(p), params: p, t: Date.now() });
  const ok = saveQueue(q);
  renderQueueBanner();
  return ok;
}
function removeQueued(p) { saveQueue(loadQueue().filter(x => x.key !== queueKey(p))); renderQueueBanner(); }
function renderQueueBanner() {
  let b = document.getElementById('queueBanner');
  const n = loadQueue().length;
  if (!n) { if (b) b.remove(); return; }
  if (!b) {
    b = document.createElement('div'); b.id = 'queueBanner'; b.className = 'queue-banner';
    const f = document.getElementById('complaintForm'); f.parentNode.insertBefore(b, f);
  }
  b.textContent = '⏳ 有 ' + n + ' 筆填單尚未寄出，連上網路後會自動重送';
  const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = '立即重送';
  btn.onclick = () => flushQueue(true); b.appendChild(btn);
}
function ensureEmailjs() {
  if (window.emailjs) return Promise.resolve(true);
  return new Promise(res => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js';
    sc.onload = () => { try { emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); } catch (e) {} res(!!window.emailjs); };
    sc.onerror = () => res(false);
    document.head.appendChild(sc);
  });
}
let flushing = false;
async function flushQueue(manual) {
  if (flushing || isSending) return;
  if (!loadQueue().length) return;
  if (!navigator.onLine) { if (manual) showToast('目前沒有網路，連上網路後會自動重送', true); return; }
  flushing = true;
  let sent = 0, failed = false;
  try {
    if (!(await ensureEmailjs())) { failed = true; return; }
    for (const item of loadQueue()) {
      try {
        await Promise.race([
          emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, item.params),
          new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000))
        ]);
        sent++;
        saveQueue(loadQueue().filter(x => x.key !== item.key));
      } catch (e) { failed = true; console.log('補寄失敗:', e); break; }
    }
  } finally {
    flushing = false;
    renderQueueBanner();
    if (sent) showToast('✅ 已自動補寄 ' + sent + ' 筆先前未送出的填單', false);
    else if (manual && failed) showToast('補寄失敗，稍後會再試', true);
  }
}
window.addEventListener('online', () => flushQueue(false));
renderQueueBanner();
setTimeout(() => flushQueue(false), 1500);

// ===== v7：找相似過往案例 =====
const SIMILAR_API = 'https://customer-service-model.onrender.com';
const SIM_TOKEN_KEY = 'similarTokenV1';
function simGetToken() { try { return localStorage.getItem(SIM_TOKEN_KEY) || ''; } catch (e) { return ''; } }
function simSetToken(t) { try { if (t) localStorage.setItem(SIM_TOKEN_KEY, t); else localStorage.removeItem(SIM_TOKEN_KEY); } catch (e) {} }
function simFetch(path, body, token, ms) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(SIMILAR_API + path, { method: 'POST', headers: headers, body: JSON.stringify(body), signal: ctl.signal })
    .finally(() => clearTimeout(timer));
}
function simShowLogin(msg) {
  const p = document.getElementById('similarPanel');
  p.innerHTML = '<div class="sim-login"><div class="sim-note">' + escapeHtml(msg || '第一次使用請輸入「查詢密碼」（與問答系統相同），這支手機之後不用再輸入。') + '</div>' +
    '<input type="password" id="simPw" placeholder="查詢密碼" autocomplete="off"><button type="button" id="simPwBtn">確認並查詢</button></div>';
  document.getElementById('simPwBtn').onclick = simLogin;
}
async function simLogin() {
  const pw = document.getElementById('simPw').value;
  if (!pw) return;
  const p = document.getElementById('similarPanel');
  p.innerHTML = '<div class="sim-note">驗證中...（伺服器休眠時可能要等約 1 分鐘）</div>';
  try {
    const r = await simFetch('/api/form-token', { password: pw }, '', 70000);
    const d = await r.json();
    if (!r.ok || !d.token) { simShowLogin((d && d.error) || '驗證失敗'); return; }
    simSetToken(d.token);
    simSearch();
  } catch (e) { simShowLogin('連線失敗，請確認網路後再試'); }
}
async function simSearch() {
  const q = document.getElementById('f_phenomenon').value.trim();
  const p = document.getElementById('similarPanel');
  if (q.length < 6) { p.innerHTML = '<div class="sim-note">請先在上面描述異常現象（至少 6 個字）再查詢。</div>'; return; }
  const token = simGetToken();
  if (!token) { simShowLogin(); return; }
  const btn = document.getElementById('btnSimilar'); btn.disabled = true;
  p.innerHTML = '<div class="sim-note">查詢中...（伺服器休眠時可能要等約 1 分鐘）</div>';
  try {
    const r = await simFetch('/api/similar', { query: q }, token, 70000);
    const d = await r.json();
    if (r.status === 401) { simSetToken(''); simShowLogin('登入已失效，請重新輸入查詢密碼'); return; }
    if (!r.ok) { p.innerHTML = '<div class="sim-note">' + escapeHtml(d.error || '查詢失敗') + '</div>'; return; }
    simRender(d.cases || []);
  } catch (e) {
    p.innerHTML = '<div class="sim-note">連不上伺服器（可能沒有網路或伺服器還在啟動），稍後再按一次。不影響填單。</div>';
  } finally { btn.disabled = false; }
}
function simRender(cases) {
  const p = document.getElementById('similarPanel');
  if (!cases.length) { p.innerHTML = '<div class="sim-note">沒有找到相近的過往案例。</div>'; return; }
  let h = '<div class="sim-note">以下是最相近的過往案例，僅供參考，不會自動帶入表單：</div>';
  cases.forEach(c => {
    const st = c.status === 'open' ? '尚未結案' : (c.status === 'closed' ? '已結案' : '');
    h += '<div class="sim-card"><div class="sim-top">#' + escapeHtml(String(c.seq || '')) + '　' + escapeHtml(c.date || '') + '　' + escapeHtml(c.device || '') + (st ? '　【' + st + '】' : '') + '</div>' +
      '<div>' + escapeHtml(c.phenomenon || '') + '</div>' +
      (c.root ? '<div><span class="sim-k">確認根因：</span>' + escapeHtml(c.root) + '</div>' : '') +
      (c.action ? '<div><span class="sim-k">矯正行動：</span>' + escapeHtml(c.action) + '</div>' : '') + '</div>';
  });
  p.innerHTML = h;
}
document.getElementById('btnSimilar').addEventListener('click', simSearch);
